name: Validate against an earlier screen

# Rebuilds the weekly screen as of a past date (last line of data/run-validate) into
# data/validation/, so it can be compared with what the old data source produced that day.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/run-validate']

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild screen as of the requested date
        shell: bash
        run: python pipeline/weekly.py --asof=$(tail -n1 data/run-validate) 2>&1 | tee data/logs-validate.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Validation run: $(tail -n1 data/run-validate)" || exit 0
          git pull --rebase
          git push
