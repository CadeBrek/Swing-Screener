name: Paper book report

# quantstats tearsheet of the paper book vs the S&P 500. Saturdays.
on:
  schedule:
    - cron: '17 14 * * 6'   # Saturdays ~9 am ET
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/paper_report.py', 'data/run-paper-report']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-research.txt
      - name: Build tearsheet
        shell: bash
        run: python pipeline/paper_report.py 2>&1 | tee data/logs-paper_report.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports && git add data reports
          git commit -m "Paper book report: $(TZ=America/New_York date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 7)); done
