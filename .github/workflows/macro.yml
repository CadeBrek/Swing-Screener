name: Macro backdrop

# Treasury curve, fed funds (and CPI/unemployment/credit spreads with a FRED key) via OpenBB. Mondays, before the screen.
on:
  schedule:
    - cron: '23 21 * * 1'   # Mondays ~4:23 pm ET
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/macro.py', 'requirements-macro.txt', 'data/run-macro']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-macro.txt
      - name: Pull macro data
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/macro.py 2>&1 | tee data/logs-macro.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports && git add data reports
          git commit -m "Macro backdrop: $(TZ=America/New_York date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 7)); done
