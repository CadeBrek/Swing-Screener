name: Weekly screen data

on:
  schedule:
    - cron: '45 21 * * 1'   # UTC: 4:45 pm ET in winter, 5:45 pm ET in summer, after the close
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/weekly.yml', 'requirements.txt', 'data/run-weekly']

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull data
        shell: bash
        run: python pipeline/weekly.py 2>&1 | tee data/logs-weekly.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Weekly screen data: $(TZ=America/New_York date +%F)" || exit 0
          git pull --rebase
          git push
