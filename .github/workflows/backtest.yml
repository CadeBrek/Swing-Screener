name: Backtest v1 rules

# 10-year backtest + rule-variant grid (vectorbt) + quantstats tearsheet. Monthly, before the review.
on:
  schedule:
    - cron: '13 11 1 * *'   # 1st of the month, ~6 am ET, before the 10:07 am review
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/backtest.py', 'pipeline/engine_sim.py', 'pipeline/rules_v1.py', 'requirements-research.txt', 'data/run-backtest']

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-research.txt
      - name: Run backtest
        shell: bash
        run: python pipeline/backtest.py 2>&1 | tee data/logs-backtest.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports && git add data reports
          git commit -m "Backtest v1 rules: $(TZ=America/New_York date +%F)" || exit 0
          git pull --rebase
          git push
