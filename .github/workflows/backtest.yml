name: Backtest live rules (v2)

# Backtest of the live rules (v2): dividend-adjusted, point-in-time S&P 500 membership, vectorbt engine
# replica, 36-variant neighbourhood, quantstats tearsheet. Monthly, before the review.
on:
  schedule:
    - cron: '13 11 1 * *'   # 1st of the month, ~6 am ET, before the 10:07 am review
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/backtest.py', 'pipeline/engine_sim.py', 'pipeline/rules_v2.py', 'data/run-backtest']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-research.txt
      - name: Export prices and membership
        shell: bash
        env:
          EXPORT_DIR: ${{ runner.temp }}/export
        run: python pipeline/export_data.py 2>&1 | tail -5 | tee data/logs-backtest.txt
      - name: Run backtest
        shell: bash
        env:
          RESEARCH_DATA: ${{ runner.temp }}/export
        run: python pipeline/backtest.py 2>&1 | tee -a data/logs-backtest.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports && git add data reports
          git commit -m "Backtest v1 rules: $(TZ=America/New_York date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 7)); done
